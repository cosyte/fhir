name: Public-surface gate

# Founder directive 2026-07-27: no internal project bookkeeping on any surface a consumer
# reads. Item identifiers, phase and wave language, ADR numbers, meta-repo paths and
# process commentary belong in the changeset, CHANGELOG.md, the commit, the PR and the
# umbrella's plans, never in README.md, docs-content/, the npm description, a JSDoc block a
# consumer's editor renders, or a message string a consumer reads in their logs.
# `cosyte-internal-refs`, the shared gate from `@cosyte/script-utils` (ST34), enforces it
# here, configured by `scripts/internal-refs.json`.
#
# WHY A GATE AND NOT A NOTE. The founder, on the sweep that removed 149 of these across the
# ecosystem: "it needs to not just be a memory note, but something that is addressed in the
# workflow accordingly. This needs to not happen again." A sweep regresses the first time
# someone writes `(Phase 12)` into a README; a job that reds does not.
#
# WHAT ACTUALLY SCANS, AND WHERE THE RULE LIVES. `pnpm check:no-internal-refs`, which runs
# `cosyte-internal-refs` from the `@cosyte/script-utils` devDependency. The job below
# delegates the plumbing (checkout, pnpm, Node, and the install the gate needs) to the shared
# gate workflow, which carries no pattern, no allow-list and no file selection of its own: it
# prepares the tree, runs the command, and lets the command's exit status decide the job. The
# rules are the shared ones; `scripts/internal-refs.json` holds this package's own prefixes,
# designations, surface, the passes over `src/` doc comments and string literals, and one
# extra rule that keeps the shared gate reading at least what this repository's former
# checker read.
#
# THE JOB ID IS LOAD-BEARING. A called job's check run is named
# `<caller job id> / <inner job id>`, so the job id `no-internal-refs` below publishes
# `no-internal-refs / public-surface`, which is the context a branch ruleset must require.
# Renaming the job detaches that requirement with no error anywhere, and a required
# context nothing emits blocks every pull request.
#
# WHY A SEPARATE WORKFLOW, and not a job in ci.yml. Same reasoning as the em-dash gate next
# door, and the first half is the deciding one:
#
#   The shared ci pipeline is not an option. This repo's `ci` job calls
#   cosyte/.github/.github/workflows/ci.yml at a published reference, which runs a fixed
#   ladder and no arbitrary repo script. Adding this there would also flip every other caller red on its next run:
#   the measured backlog was 149 internal references across 11 repos, and remediating each
#   is its own deliberate piece of work. A shared pipeline is the wrong place to land a rule
#   most of its callers cannot yet satisfy.
#
#   Within this repo, keeping it out of ci.yml also keeps it cheap: this job is a checkout,
#   an install and one scan over the public surface and the source files, while ci.yml
#   drives the full Node 22, 24, and 26 matrix, a fuzz job at FUZZ_RUNS=20000, and a
#   differential job that downloads validator_cli.jar and runs a JVM oracle over four corpora.
#
# WHAT THIS DOES NOT CHECK, deliberately: the PR title, the PR body, and commit messages.
# The em-dash gate scans all three because the brand rule names commit messages explicitly.
# THIS rule says the opposite: identifiers BELONG in the commit, the PR and the changeset,
# so a PR-text half here would red on correct work. That is also why there is no `edited`
# trigger: nothing here reads PR text, so retitling a PR cannot change the result. It is
# the one place this gate and the em-dash gate next door disagree about their triggers, and
# the disagreement is the rule, not an oversight.
#
# The other half of this rule, the one that keeps identifiers out of a published RELEASE
# BODY, lives in the shared pipeline: `cosyte/.github` `scripts/release-notes.mjs assert`
# re-reads the finished body bytes and refuses to publish a violating one. This job covers
# the repo's own files; that one covers what gets published to the releases page.
#
# Run it locally with `pnpm check:no-internal-refs`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The check-run context prefix. See the note above before touching this id.
  no-internal-refs:
    # Named by the published reference, as its release notes show. That release is
    # immutable, so its tag cannot be moved or deleted, and every workflow caller in
    # this repository names the same reference and moves to the next one together.
    uses: cosyte/.github/.github/workflows/gate-no-internal-refs-install.yml@c0db8d8e5927269820de4401b3b5ad6141854b76 # workflows-2026-11-08-c0db8d8e5927
    # No more than the scan needs. A called workflow's GITHUB_TOKEN can only be
    # downgraded by its caller, and this gate reads the tree and nothing else.
    permissions:
      contents: read
