name: Public-surface gate

# Founder directive 2026-07-27: no internal project bookkeeping on any surface a consumer
# reads. Item identifiers, phase and wave language, ADR numbers, meta-repo paths and
# process commentary belong in the changeset, CHANGELOG.md, the commit, the PR and the
# roadmap, never in README.md, docs-content/, the npm description, a JSDoc block a
# consumer's editor renders, or a message string a consumer reads in their logs. The rule
# is written out in the meta-repo's `documentation/conventions.md` ("No internal project
# bookkeeping on a public surface"); `scripts/check-no-internal-refs.sh` is what enforces
# it.
#
# WHY A GATE AND NOT A NOTE. The founder, on the sweep that removed 149 of these across the
# ecosystem: "it needs to not just be a memory note, but something that is addressed in the
# workflow accordingly. This needs to not happen again." A sweep regresses the first time
# someone writes `(Phase 12)` into a README; a job that reds does not.
#
# WHY A SEPARATE WORKFLOW, and not a job in ci.yml. Same reasoning as the em-dash gate next
# door, and the first half is the deciding one:
#
#   The reusable pipeline is not an option. This repo's `ci` job calls
#   cosyte/.github/.github/workflows/ci.yml@main, which runs a fixed ladder and no arbitrary
#   repo script. Adding this there would also flip every other caller red on its next run:
#   the measured backlog was 149 internal references across 11 repos, and remediating each
#   is its own deliberate piece of work. A shared pipeline is the wrong place to land a rule
#   most of its callers cannot yet satisfy.
#
#   Within this repo, keeping it out of ci.yml also keeps it cheap: this job is a checkout
#   and a handful of greps over 4 public-surface files and 58 source files, while ci.yml
#   drives the full Node 22 + 24 matrix, a fuzz job at FUZZ_RUNS=20000, and a differential
#   job that downloads validator_cli.jar and runs a JVM oracle over two corpora.
#
# WHAT THIS DOES NOT CHECK, deliberately: the PR title, the PR body, and commit messages.
# The em-dash gate scans all three because the brand rule names commit messages explicitly.
# THIS rule says the opposite: identifiers BELONG in the commit, the PR and the changeset,
# so a PR-text half here would red on correct work. That is also why there is no `edited`
# trigger: nothing here reads PR text, so retitling a PR cannot change the result. It is
# the one place this gate and the em-dash gate next door disagree about their triggers, and
# the disagreement is the rule, not an oversight.
#
# The other half of this rule, the one that keeps identifiers out of a published RELEASE
# BODY, lives in the shared pipeline: `cosyte/.github` `scripts/release-notes.mjs assert`
# re-reads the finished body bytes and refuses to publish a violating one. This job covers
# the repo's own files; that one covers what gets published to the releases page.
#
# Run it locally with `pnpm check:no-internal-refs`, which is also on the meta-repo's
# `scripts/verify.sh fhir` ladder.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job id is the check-run context name a branch ruleset requires. Renaming it
  # silently detaches the required check, so the ruleset stops protecting anything while
  # still looking configured. Rename both together or neither.
  no-internal-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The script self-tests before it reports: it proves each rule still matches its own
      # positive sample AND still lets through the reference material it was most likely to
      # destroy (`FHIR-R4`, `HL7-V2`, `US-Core`, the ICD-10-CM code `T78.40XA`, the LOINC
      # code `8480-6`, the `ait-1` / `con-3` / `obs-6` invariants, a Phase III trial). It
      # refuses to print OK from a scan that did not read all of its input. No `|| true`,
      # no `continue-on-error`: a check that cannot fail is documentation.
      - name: Check the public surface
        run: bash scripts/check-no-internal-refs.sh
