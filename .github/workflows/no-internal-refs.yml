name: Public-surface gate

# A public repository carries no internal bookkeeping on any surface a reader sees: no item,
# decision or standard ids, no phase, plan or wave names, no decision numbers, no private
# repository names or paths, and no session ids. Such a reference points at a record the reader
# cannot open. `cosyte-internal-refs`, the shared gate from `@cosyte/script-utils`, enforces it
# here, configured by `scripts/internal-refs.json`.
#
# WHAT SCANS. `pnpm check:no-internal-refs` runs `cosyte-internal-refs` from the devDependency.
# It reads the public surface `scripts/internal-refs.json` names (README.md, LICENSE and
# docs-content/), the files under `.changeset/`, `CLAUDE.md`, `AGENTS.md` and
# `.github/workflows/` whole, and the comments and string literals in the source under `src/`
# and `test/`. The shared gate workflow does the plumbing (checkout, pnpm, Node, and the install
# the gate needs) and carries no pattern, no allow-list and no file selection of its own: the
# command's exit status decides the job. `scripts/internal-refs.json` holds this package's own
# prefixes, designations and surface, and one extra rule for phase and wave language.
#
# THE JOB ID IS LOAD-BEARING. A called job's check run is named `<caller job id> / <inner job
# id>`, so the job id `no-internal-refs` below publishes `no-internal-refs / public-surface`, the
# context a branch ruleset requires. Renaming the job detaches that requirement with no error
# anywhere. Do not rename it.
#
# WHY A SEPARATE WORKFLOW, and not a job in ci.yml. The shared ci pipeline runs a fixed ladder and
# no repository script, and keeping the gate out of ci.yml keeps it cheap: a checkout, an install
# and one scan, where ci.yml drives a Node matrix on three systems, a fuzz job and a differential
# job.
#
# WHAT THIS DOES NOT CHECK: the pull request title, its body, and commit messages. There is no
# `edited` trigger, since nothing here reads pull request text. A published release body is held
# to the same rule by the shared release workflow, which refuses to publish one that breaks it.
#
# Run it locally with `pnpm check:no-internal-refs`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The check-run context prefix. See the note above before touching this id.
  no-internal-refs:
    # Named by the published reference, as its release notes show. That release is
    # immutable, so its tag cannot be moved or deleted, and every workflow caller in
    # this repository names the same reference and moves to the next one together.
    uses: cosyte/.github/.github/workflows/gate-no-internal-refs-install.yml@c0db8d8e5927269820de4401b3b5ad6141854b76 # workflows-2026-11-08-c0db8d8e5927
    # No more than the scan needs. A called workflow's GITHUB_TOKEN can only be
    # downgraded by its caller, and this gate reads the tree and nothing else.
    permissions:
      contents: read
