name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Universal gates from the shared pipeline (typecheck, lint, format, test, coverage, build, attw,
  # dual ESM/CJS smoke, actionlint) on the standard Node matrix. The full test suite, including the
  # P11 fuzz, PHI-leak, and type-level tiers, runs here at the default iteration count and gates.
  # fhir ships a PHI scanner (scripts/phi-scan.ts), so the shared pipeline's optional PHI-scan step
  # is switched on.
  ci:
    uses: cosyte/.github/.github/workflows/ci.yml@main
    with:
      run-phi-scan: true

  # P11 fuzz tier at fuzz-scale (FHIR-P11): the JSON + XML adversarial harness (XXE, billion-laughs,
  # deep nesting, `_element` games, huge/scientific numbers, prototype-chain keys) run at a raised
  # iteration count, plus the PHI-leak sweep. The contract: adversarial input never crashes / hangs /
  # OOMs, always a typed error or a bounded rejection, and no value ever reaches a diagnostic.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fuzz + PHI-leak tiers (raised iteration count)
        env:
          FUZZ_RUNS: "20000"
        run: pnpm vitest run test/fuzz.test.ts test/phi-leak.test.ts

  # Differential vs the official validator (`org.hl7.fhir.core` / validator_cli.jar), roadmap §6.
  # AUTHORED, NOT YET PROVEN: the oracle is a JVM program, so this gate can only run here (never in the
  # dev container). The corpus is declared in corpus/corpus.json and is no longer ten in-tree
  # fixtures. Three corpora, only the first written here: this repository's own synthetic spec-clean
  # + Tier-2 quirk fixtures (P11 / P10b, provenance in test/quirk-corpus.test.ts); FHIR/fhir-test-cases
  # at tag 1.7.67 (Apache-2.0), the shared corpus the reference validator pins itself against; and the
  # FHIR R4 4.0.1 specification's own published examples (CC0-1.0). The third-party documents are
  # FETCHED, never committed: `pnpm corpus:fetch` materialises them into the git-ignored
  # corpus/documents/ and verifies a SHA-256 per document. A genuinely vendor-proprietary quirk absent
  # from every public sample stays grounded-only and is not in the corpus (inventing one is forbidden),
  # and no document here was hand-authored to reach the count (ADR 0018).
  #
  # THE ORACLE IS PINNED TO A RELEASE, NOT TO `releases/latest`. A moving pointer means two runs of
  # the same commit can disagree about what they compared against and neither log says why. The
  # release below and the one in scripts/differential/oracle.mjs (ORACLE_RELEASE) are the same
  # release, and the harness prints the sha256 of the jar it actually loaded beside every result, so
  # a substituted artifact is visible even when this string does not move.
  #
  # AND THE ORACLE'S TERMINOLOGY ANSWERS ARE PINNED THE SAME WAY, BY BEING ABSENT. A pinned release
  # was not enough: the validator resolves coding displays and code membership against a TERMINOLOGY
  # SERVER, and its documented default is the public https://tx.fhir.org. That made a differential
  # verdict a function of what a remote service answered on the day, and three documents landed in
  # the safety-critical FALSE VALID bucket on one run and not the next with nothing having moved. So
  # the run DECLARES its terminology inputs (scripts/differential/terminology.mjs, `source: "none"`
  # today), spells `-tx n/a` and `-txCache n/a` into the oracle's argv, AUDITS that argv before a
  # single document is staged, and compares nothing at all if any terminology question would remain
  # answerable over a network or the declared inputs cannot be honoured exactly. The terminology
  # inputs are printed beside the oracle identity on every run.
  #
  # A terminology finding is then a RECORDED CLASS rather than a verdict: this library declaredly
  # vendors no terminology content, so scripts/differential/compare.mjs classifies such a finding out
  # of BOTH invariants, counts it and prints it per document. An oracle error or fatal OUTSIDE that
  # class, on a document this library reports clean, is still a false valid and still fails the job.
  differential:
    runs-on: ubuntu-latest
    # A DECLARED TIME BOUND, NOT THE RUNNER DEFAULT. ~180 documents through a JVM oracle is minutes,
    # not seconds, and a corpus that cannot finish must fail visibly rather than sit for six hours.
    # The determinism step below fits inside this same bound by repeating a DECLARED SUBSET
    # (corpus/corpus.json, `determinismSubset`) rather than the whole corpus: the full corpus does
    # not go through the oracle three times in thirty minutes. The check prints every repeated
    # document id before it starts, so the log says what determinism was demonstrated over.
    timeout-minutes: 30
    env:
      # Keep in step with ORACLE_RELEASE in scripts/differential/oracle.mjs.
      ORACLE_RELEASE: "6.10.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (the differential harness imports the built package)
        run: pnpm build
      - name: Materialise the differential corpus (digest-verified, never committed)
        run: pnpm corpus:fetch
      - name: Download validator_cli.jar at a PINNED release (the differential oracle)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/validator_cli.jar" \
            "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${ORACLE_RELEASE}/validator_cli.jar"
      - name: Differential (three corpora, >= 100 documents, count + oracle identity + terminology inputs printed)
        # ubuntu-latest ships a Temurin JDK; $JAVA_HOME_21_X64 is set by the runner image. The
        # differential harness invokes `java` from PATH, no unpinned setup-java action needed.
        env:
          VALIDATOR_CLI_JAR: ${{ runner.temp }}/validator_cli.jar
        run: |
          export PATH="${JAVA_HOME_21_X64:-$JAVA_HOME}/bin:$PATH"
          java -version
          node scripts/differential.mjs
      - name: Determinism (the declared subset compared TWICE, run records must be byte-identical)
        # Its failure is the job's failure, and it is never softened into a warning: this step
        # reports determinism NOT demonstrated and exits non-zero for every condition it cannot rule
        # out, including a missing jar and a document that yielded no readable outcome. A silent skip
        # would make a green job mean "the oracle was absent" and "the oracle answered the same way
        # twice" interchangeably, which is worse than having no check.
        env:
          VALIDATOR_CLI_JAR: ${{ runner.temp }}/validator_cli.jar
        run: |
          export PATH="${JAVA_HOME_21_X64:-$JAVA_HOME}/bin:$PATH"
          node scripts/differential-determinism.mjs
