name: Weekly mutation

# The full mutation run: every source file stryker.config.mjs names is mutated, split across
# parallel jobs (shards), and the merged score is held to the floor in quality-floor.json. A score
# below its floor turns the run red. The run never commits: to raise the floor, run
# `pnpm mutate:full` and `pnpm quality:raise --skip coverage`, and open a pull request. The merged
# report is kept in the `mutation-report` artifact. The shared job is cosyte/.github's
# weekly-mutation.yml.
#
# Twice a week: GitHub evicts a cache entry nobody has read for 7 days, and each shard keeps
# StrykerJS's incremental results there, so a run every three or four days retests only what
# changed since the last one.

on:
  schedule:
    # Sunday and Wednesday 06:53 UTC. An odd minute: GitHub delays scheduled runs at the start of
    # every hour.
    - cron: "53 6 * * 0"
    - cron: "53 6 * * 3"
  workflow_dispatch:
  # Temporary: measure this run on the pull request branch. Removed before merge.
  push:
    branches: [test/testing-standard]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  weekly:
    uses: cosyte/.github/.github/workflows/weekly-mutation.yml@398cd4ded647dddd9f2e220ceb042840f59e1426 # workflows-2026-11-10-398cd4ded647
    with:
      mutate-cmd: "pnpm mutate:full"
      # About 27,000 lines of source in 60 files; the safety readout's status table alone is 2,700.
      # A file is in exactly one shard, by the hash of its path, and the run takes the most shards
      # the shared job allows.
      shard-count: 16
