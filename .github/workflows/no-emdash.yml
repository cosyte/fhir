name: Em-dash gate

# Our writing rule bans the em dash (U+2014) and the en dash (U+2013) on every surface, commit
# messages included. This workflow is the CI half of that rule for this repo: the tracked files,
# and the pull request text that is not a file.
#
# WHAT SCANS. `pnpm check:no-emdash` runs `cosyte-no-emdash`, the shared dash gate, from the
# `@cosyte/script-utils` devDependency. It reads every tracked file and every tracked file name for
# both dashes, as characters and in every encoded form. This repository excludes nothing, so it
# carries no scripts/check-no-emdash.exclude. The shared gate workflow does the plumbing
# (checkout, pnpm, Node, and the install the gate needs) and carries no pattern, no allow-list and
# no file selection of its own: the command's exit status decides the job.
#
# TWO CONTEXTS, AND THE JOB ID IS LOAD-BEARING. A called job's check run is named
# `<caller job id> / <inner job id>`, so the job id `no-emdash` below publishes
# `no-emdash / tracked-files` and `no-emdash / messages`. A branch ruleset binds to those exact
# strings: renaming the job detaches the requirement with no error anywhere. Do not rename it.
#
#   `no-emdash / tracked-files` is the half that blocks a merge. `no-emdash / messages` runs and
#   reds its own context, and is never required: Dependabot writes a pull request body from
#   upstream release notes, dashes included.
#
# WHY A SEPARATE WORKFLOW, not a step in ci.yml. The message half needs the `edited` pull_request
# activity type, or a title or body changed after the last push is never checked again, and the
# squash merge writes that title and body into `main`. ci.yml is far too heavy to run on every
# edit of a pull request description; this workflow is a checkout, an install and one command.
#
# Run the file half locally with:  pnpm check:no-emdash

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

# No concurrency group. A push and a title or body edit can arrive together (Dependabot does both),
# and a run a group cancels, even a queued one under `cancel-in-progress: false`, can count as a
# failed required check and block the merge until someone re-runs it. Each run takes seconds, so
# every one finishes and the newest result stands.

permissions:
  contents: read

jobs:
  # The check-run context prefix. See the note above before touching this id.
  no-emdash:
    # Named by the published reference, as its release notes show. That release is
    # immutable, so its tag cannot be moved or deleted, and every workflow caller in
    # this repository names the same reference and moves to the next one together.
    uses: cosyte/.github/.github/workflows/gate-no-emdash-install.yml@c0db8d8e5927269820de4401b3b5ad6141854b76 # workflows-2026-11-08-c0db8d8e5927
    # No more than the scan needs. A called workflow's GITHUB_TOKEN can only be
    # downgraded by its caller, and this gate reads the tree and nothing else.
    permissions:
      contents: read
