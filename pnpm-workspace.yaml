# Install-time hardening. `packageManager` in package.json pins pnpm 10.34.5, which knows both keys
# below: minimumReleaseAge arrived in pnpm 10.16.0 and trustPolicy in 10.21.0, and an older pnpm
# ignores them, which is a settings file that decorates rather than defends.
#
# minimumReleaseAge: a package version younger than this many minutes (1440 = 24 hours) is not
# installable, so a compromised release has to survive a day of public scrutiny before it can reach
# this tree. pnpm's own rationale: "Since malware is usually detected quickly, delaying updates by
# 24 hours will most likely prevent you from installing a bad version"
# (https://pnpm.io/supply-chain-security).
# @cosyte is exempt by operator decision; every third-party package keeps the floor.
# trustPolicy: `no-downgrade` refuses a package whose trust evidence is weaker than that of an
# earlier-published version of the same package.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # reason: first-party @cosyte package, exempt from the floor by operator decision
  - "@cosyte/*"
trustPolicy: no-downgrade

# Each exemption is pinned to the exact version pnpm-lock.yaml resolves, so a later release of the
# same package is graded again rather than inheriting the exemption.
trustPolicyExclude:
  # reason: measured 2026-11-07 on pnpm 10.34.5, as hl7 measured it on 2026-09-08. A from-scratch
  # resolution of this repository's dependency set reds with ERR_PNPM_TRUST_DOWNGRADE on
  # undici-types, a transitive of @types/node pinned at this version by pnpm-lock.yaml: "Earlier
  # versions had provenance attestation, but this version has no trust evidence". That is a
  # publisher who stopped attaching provenance, not a takeover: the package is types only, with no
  # runtime code and no install scripts.
  - "undici-types@6.21.0"
  # reason: measured 2026-11-07 on pnpm 10.34.5, the same shape, found by the same resolution once
  # undici-types was excluded. chokidar is a transitive of tsup pinned at this version by
  # pnpm-lock.yaml; earlier releases carry a provenance attestation and 4.0.3 carries none. pnpm's
  # own documentation uses this package and version as its worked example of a trustPolicyExclude
  # entry (https://pnpm.io/settings/dependency-resolution).
  - "chokidar@4.0.3"
